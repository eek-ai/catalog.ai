<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>catalog.ai.ua — каталог українських AI-продуктів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --ink: #121418;
  --ink-2: #3a3f48;
  --muted: #747a86;
  --line: #e3e3df;
  --line-soft: #eeeeea;
  --hover: #f4f5f2;
  --accent: #1d4ed8;
  --accent-soft: #eaf0fd;
  --ok: #1f8a55;
  --pilot: #8f5400;
  --pilot-bg: #fcf0d9;
  --sans: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --header-h: 112px;
  --radius: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

/* Header */
.header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
.header-top { display: flex; align-items: center; gap: 24px; height: 60px; }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.wordmark { font: 600 17px/1 var(--mono); letter-spacing: -.02em; white-space: nowrap; }
.wordmark b { color: var(--accent); font-weight: 600; }
.tagline { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
.search input { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font: 14px var(--sans); color: var(--ink); outline: none; transition: border-color .15s, background .15s; }
.search input:focus { border-color: var(--ink); background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.search kbd { position: absolute; right: 9px; top: 9px; font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--surface); }
.lang { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font: 500 12px var(--mono); }
.lang button { border: 0; background: none; padding: 7px 10px; color: var(--muted); }
.lang button.on { background: var(--ink); color: #fff; }
.header-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 52px; }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: none; padding: 7px 12px; border-radius: var(--radius); font-weight: 500; color: var(--ink-2); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.tab:hover { background: var(--hover); }
.tab .n { font: 12px var(--mono); color: var(--muted); }
.tab.on { background: var(--ink); color: #fff; }
.tab.on .n { color: rgba(255,255,255,.6); }
.stats { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.stats b { color: var(--ink); font-weight: 600; }

/* Layout */
.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; padding-top: 28px; padding-bottom: 56px; }
.sidebar { position: sticky; top: calc(var(--header-h) + 28px); align-self: start; }
.label { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.label .n { color: var(--ink); }
.sectors { list-style: none; margin: 0; padding: 0; }
.sector-btn { width: 100%; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 0; background: none; border-radius: var(--radius); text-align: left; color: var(--ink-2); font-size: 13px; }
.sector-btn:hover { background: var(--hover); color: var(--ink); }
.sector-btn.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.sector-btn.empty { opacity: .45; }
.sector-btn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sector-btn .n { font: 12px var(--mono); color: var(--muted); }
.mk { flex: none; display: inline-block; min-width: 30px; text-align: center; font: 600 9.5px/1 var(--mono); letter-spacing: .04em; padding: 3px 3px; border: 1px solid currentColor; border-radius: 3px; color: var(--ink-2); opacity: .8; }
.mk.all { border-style: dashed; }
#app { min-height: calc(100vh - 200px); }
.main { min-width: 0; }
.section { margin-bottom: 32px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 0; }
.section-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.section-head h2 .n { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.more-link { font: 500 12.5px var(--mono); color: var(--accent); white-space: nowrap; }
.more-link:hover { text-decoration: underline; }

/* Featured strip */
.featured { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 1px solid var(--line); }
.feat { position: relative; padding: 14px 16px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: background .15s; }
.feat:hover { background: var(--hover); }
.feat-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.feat-idx { font: 11px var(--mono); color: var(--muted); }
.feat-name { font-weight: 600; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feat-name::after { content: ""; position: absolute; inset: 0; }
.feat-descr { color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.feat-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: auto; }
.feat-meta .sec { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Rows (directory) */
.rows { background: var(--surface); }
.row, .row-head { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 200px 78px 52px; gap: 16px; align-items: center; padding: 0 12px; }
.with-date .row, .with-date .row-head { grid-template-columns: 84px minmax(150px, 220px) minmax(0, 1fr) 200px 78px 52px; }
.row-head { position: sticky; top: var(--header-h); z-index: 5; height: 34px; background: var(--bg); border-bottom: 1px solid var(--line); font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.row { position: relative; min-height: 42px; border-bottom: 1px solid var(--line-soft); transition: background .12s; }
.row:hover { background: var(--hover); }
.row:hover .r-name { color: var(--accent); }
.r-date { font: 12px var(--mono); color: var(--muted); }
.r-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-name::after { content: ""; position: absolute; inset: 0; }
.r-descr { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.r-sector { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--muted); }
.r-sector span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-status { display: flex; }
.status { font: 500 11.5px var(--mono); display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.status.pilot { color: var(--pilot); background: var(--pilot-bg); padding: 2px 7px; border-radius: 3px; }
.status.pilot::before { background: var(--pilot); }
.site { position: relative; z-index: 1; font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; justify-self: end; padding: 4px 6px; border-radius: 4px; }
.site:hover { color: var(--accent); background: var(--accent-soft); }
.empty-note { padding: 32px 12px; color: var(--muted); text-align: center; font-size: 13px; }
.show-more { display: block; width: 100%; margin-top: 12px; height: 40px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font: 500 13px var(--mono); color: var(--ink-2); }
.show-more:hover { border-color: var(--ink); color: var(--ink); }
.filters-note { font: 12px var(--mono); color: var(--muted); }
.filters-note button { border: 0; background: none; color: var(--accent); padding: 0; font: inherit; }

/* #new view */
.back { display: inline-flex; gap: 6px; font: 500 13px var(--mono); color: var(--muted); margin: 4px 0 18px; }
.back:hover { color: var(--ink); }
.page-title { font-size: 26px; letter-spacing: -.02em; margin: 0 0 6px; }
.page-sub { color: var(--muted); margin: 0 0 22px; }

/* Footer */
.footer { border-top: 1px solid var(--line); background: var(--surface); }
.footer .wrap { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-top: 22px; padding-bottom: 28px; font-size: 13px; color: var(--muted); }
.footer b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
.footer a { color: var(--ink-2); border-bottom: 1px solid var(--line); }
.footer a:hover { color: var(--accent); border-color: var(--accent); }

.badge { position: fixed; right: 16px; bottom: 16px; z-index: 50; background: var(--ink); color: #fff; font: 500 12px var(--mono); padding: 8px 12px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.badge:hover { background: var(--accent); }

@media (max-width: 1080px) {
  .tagline { display: none; }
  .row, .row-head { grid-template-columns: minmax(130px, 190px) minmax(0, 1fr) 46px 78px 52px; }
  .with-date .row, .with-date .row-head { grid-template-columns: 84px minmax(130px, 190px) minmax(0, 1fr) 46px 78px 52px; }
  .row .r-sector span:last-child { display: none; }
  .row-head .h-sector { font-size: 0; }
  .featured { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .wrap { padding: 0 16px; }
  .header { position: static; }
  .header-top { flex-wrap: wrap; height: auto; padding: 12px 16px 10px; gap: 10px 12px; }
  .lang { margin-left: auto; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .search kbd { display: none; }
  .header-bottom { height: auto; padding-bottom: 10px; flex-direction: column; align-items: stretch; gap: 8px; }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tab { flex: 1; justify-content: center; padding: 8px 6px; }
  .stats { font-size: 11px; white-space: normal; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 20px; }
  .sidebar { position: static; min-width: 0; }
  .sectors { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .sector-btn { width: auto; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; }
  .sector-btn .name { overflow: visible; }
  .featured { grid-template-columns: minmax(0, 1fr); }
  .row-head { display: none; }
  .row, .with-date .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name status" "descr descr" "sector site"; gap: 4px 12px; padding: 12px 4px; }
  .r-name { grid-area: name; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .r-descr { grid-area: descr; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .r-sector { grid-area: sector; }
  .row .r-sector span:last-child { display: inline; }
  .r-status { grid-area: status; justify-self: end; }
  .site { grid-area: site; }
  .with-date .row { grid-template-areas: "date date" "name status" "descr descr" "sector site"; }
  .r-date { grid-area: date; }
  .footer .wrap { padding-bottom: 72px; }
}
</style>
</head>
<body>
<header class="header" id="header">
  <div class="wrap header-top">
    <a class="brand" href="#">
      <span class="wordmark">catalog<b>.ai.ua</b></span>
      <span class="tagline">Живий каталог українських AI-продуктів</span>
    </a>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Пошук за назвою чи описом" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="lang" role="group" aria-label="Мова"><button class="on">UA</button><button>EN</button></div>
  </div>
  <div class="wrap header-bottom">
    <nav class="tabs" id="tabs"></nav>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="wrap" id="app"></div>

<footer class="footer">
  <div class="wrap">
    <div><b>catalog.ai.ua</b> — каталог ведуть AI-агенти, а перевіряють люди. Оновлюється кілька разів на тиждень.</div>
    <div>Контакти: <a href="#">Telegram</a> · <a href="#">email</a> · <a href="#">Запропонувати продукт</a></div>
  </div>
</footer>

<a class="badge" href="./">Варіант 03 · Directory</a>

<script src="data.js"></script>
<script>
const TYPES = [["tool", "Інструменти"], ["model", "Моделі"], ["company", "Компанії"]];
const SECTOR_CODES = {
  "Оборона та безпека": "ОБР", "Інфраструктура та платформи": "ІНФ", "Бізнес та продажі": "БІЗ",
  "Голос і мовлення": "ГОЛ", "Медицина та здоров'я": "МЕД", "Право": "ПРА",
  "Медіа та інформаційна безпека": "МІБ", "Освіта": "ОСВ", "Державний сектор": "ДЕР",
  "Маркетинг та реклама": "МАР", "Генеративний контент": "ГЕН", "Інше": "ІНШ"
};
const PAGE = 40;
const state = { type: "tool", sector: null, query: "", limit: PAGE };
let data = null;
let bySlug = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => iso ? iso.split("-").reverse().join(".") : "";
const marker = sector => `<span class="mk" title="${esc(sector)}">${SECTOR_CODES[sector] || "—"}</span>`;
const status = s => s === "Пілот" ? `<span class="status pilot">Пілот</span>` : `<span class="status">Працює</span>`;
const siteLink = e => e.url ? `<a class="site" href="${esc(e.url)}" target="_blank" rel="noopener">Сайт ↗</a>` : "<span></span>";
const pick = slugs => slugs.map(s => bySlug[s]).filter(Boolean);
const typeLabel = t => TYPES.find(([k]) => k === t)[1];

function rowHtml(e, withDate) {
  return `<div class="row">
    ${withDate ? `<span class="r-date">${fmtDate(e.added)}</span>` : ""}
    <a class="r-name" href="#" data-entry>${esc(e.name)}</a>
    <span class="r-descr" title="${esc(e.descr_short)}">${esc(e.descr_short)}</span>
    <span class="r-sector">${marker(e.sector)}<span>${esc(e.sector)}</span></span>
    <span class="r-status">${status(e.status)}</span>
    ${siteLink(e)}
  </div>`;
}

function rowsHtml(list, withDate) {
  const head = `<div class="row-head">${withDate ? "<span>Додано</span>" : ""}<span>Назва</span><span>Опис</span><span class="h-sector">Сектор</span><span>Статус</span><span></span></div>`;
  const body = list.length ? list.map(e => rowHtml(e, withDate)).join("") : `<div class="empty-note">Нічого не знайдено. Спробуйте інший запит або сектор.</div>`;
  return `<div class="rows${withDate ? " with-date" : ""}">${head}${body}</div>`;
}

function featuredHtml() {
  const cells = pick(data.featured).map((e, i) => `
    <article class="feat">
      <div class="feat-top"><span class="feat-idx">0${i + 1}</span><a class="feat-name" href="#" data-entry>${esc(e.name)}</a></div>
      <div class="feat-descr">${esc(e.descr_short)}</div>
      <div class="feat-meta"><span class="r-sector">${marker(e.sector)}<span class="sec">${esc(e.sector)}</span></span>${e.status === "Пілот" ? status(e.status) : siteLink(e)}</div>
    </article>`).join("");
  return `<section class="section">
    <div class="section-head"><h2>Вибір редакції <span class="n">${data.featured.length}</span></h2></div>
    <div class="featured">${cells}</div>
  </section>`;
}

function newestTeaserHtml() {
  return `<section class="section">
    <div class="section-head"><h2>Нові інструменти <span class="n">останні додані</span></h2><a class="more-link" href="#new">Усі нові →</a></div>
    ${rowsHtml(pick(data.newest).slice(0, 4), true).replace('class="row-head"', 'class="row-head" style="position:static"')}
  </section>`;
}

function filteredEntries() {
  const q = state.query.trim().toLowerCase();
  return data.entries
    .filter(e => e.type === state.type)
    .filter(e => !state.sector || e.sector === state.sector)
    .filter(e => !q || (e.name + " " + e.descr_short).toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, "uk"));
}

function catalogHtml() {
  const list = filteredEntries();
  const filters = [state.sector, state.query.trim() && `«${state.query.trim()}»`].filter(Boolean);
  const note = filters.length ? `<span class="filters-note">${esc(filters.join(" · "))} · <button data-reset>скинути</button></span>` : "";
  const more = list.length > state.limit ? `<button class="show-more" data-more>Показати ще · ${list.length - state.limit}</button>` : "";
  return `<section class="section" id="catalog">
    <div class="section-head"><h2>${typeLabel(state.type)} <span class="n">${list.length}</span></h2>${note}</div>
    ${rowsHtml(list.slice(0, state.limit), false)}
    ${more}
  </section>`;
}

function sidebarHtml() {
  const ofType = data.entries.filter(e => e.type === state.type);
  const counts = {};
  ofType.forEach(e => counts[e.sector] = (counts[e.sector] || 0) + 1);
  const sectors = Object.keys(SECTOR_CODES).sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
  const item = (sector, label, n, mk) => `<li><button class="sector-btn${state.sector === sector ? " on" : ""}${n ? "" : " empty"}" data-sector="${esc(sector || "")}">${mk}<span class="name">${esc(label)}</span><span class="n">${n}</span></button></li>`;
  return `<aside class="sidebar">
    <p class="label">Сектори <span class="n">12</span></p>
    <ul class="sectors">
      ${item(null, "Усі сектори", ofType.length, `<span class="mk all">ALL</span>`)}
      ${sectors.map(s => item(s, s, counts[s] || 0, marker(s))).join("")}
    </ul>
  </aside>`;
}

function renderHeader() {
  document.getElementById("tabs").innerHTML = TYPES.map(([key, label]) => {
    const n = data.entries.filter(e => e.type === key).length;
    return `<button class="tab${state.type === key ? " on" : ""}" data-type="${key}">${label}<span class="n">${n}</span></button>`;
  }).join("");
  const updated = data.entries.reduce((max, e) => e.added > max ? e.added : max, "");
  document.getElementById("stats").innerHTML =
    `<b>${data.entries.length}</b> продуктів · <b>${Object.keys(SECTOR_CODES).length}</b> секторів · оновлено <b>${fmtDate(updated)}</b>`;
}

function renderMain() {
  return `<div class="layout">${sidebarHtml()}<main class="main">
    ${featuredHtml()}${newestTeaserHtml()}${catalogHtml()}
  </main></div>`;
}

function renderNew() {
  return `<div class="layout" style="grid-template-columns:minmax(0,1fr)"><main class="main">
    <a class="back" href="#">← До каталогу</a>
    <h1 class="page-title">Нові інструменти</h1>
    <p class="page-sub">${data.newest.length} останніх доданих інструментів — від найновішого.</p>
    ${rowsHtml(pick(data.newest), true)}
  </main></div>`;
}

function render() {
  if (!data) return;
  renderHeader();
  const isNew = location.hash === "#new";
  document.getElementById("app").innerHTML = isNew ? renderNew() : renderMain();
  syncHeaderHeight();
}

function rerenderCatalog() {
  if (location.hash === "#new") return;
  document.querySelector(".sidebar").outerHTML = sidebarHtml();
  document.getElementById("catalog").outerHTML = catalogHtml();
}

function syncHeaderHeight() {
  const header = document.getElementById("header");
  const sticky = getComputedStyle(header).position === "sticky";
  document.documentElement.style.setProperty("--header-h", (sticky ? header.offsetHeight : 0) + "px");
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-entry],[data-type],[data-sector],[data-more],[data-reset],.lang button");
  if (!t) return;
  if (t.matches("[data-entry]")) return ev.preventDefault();
  if (t.matches(".lang button")) {
    t.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === t));
    return;
  }
  if (t.dataset.type) {
    Object.assign(state, { type: t.dataset.type, sector: null, limit: PAGE });
    if (location.hash === "#new") { location.hash = ""; return; }
    renderHeader();
    rerenderCatalog();
    document.getElementById("catalog").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (t.hasAttribute("data-sector")) {
    state.sector = t.dataset.sector || null;
    state.limit = PAGE;
  } else if (t.hasAttribute("data-more")) {
    state.limit += PAGE;
  } else if (t.hasAttribute("data-reset")) {
    Object.assign(state, { sector: null, query: "", limit: PAGE });
    document.getElementById("q").value = "";
  }
  rerenderCatalog();
});

document.getElementById("q").addEventListener("input", ev => {
  state.query = ev.target.value;
  state.limit = PAGE;
  if (location.hash === "#new") { location.hash = ""; return; }
  rerenderCatalog();
});

document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement.tagName !== "INPUT") { ev.preventDefault(); document.getElementById("q").focus(); }
});

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
window.addEventListener("resize", syncHeaderHeight);

Promise.resolve({ json: () => window.CATALOG })
  .then(r => r.json())
  .then(json => {
    data = json;
    data.entries.forEach(e => bySlug[e.slug] = e);
    render();
  })
  .catch(() => {
    document.getElementById("app").innerHTML = `<div class="empty-note">Не вдалося завантажити дані.</div>`;
  });
</script>
</body>
</html>
