name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build site
        run: npm run build

      - name: Verify generated site
        run: npm run verify

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Failure-only: success is already reported by the factory's publish-web run.
  # A failed deploy after a successful publish would otherwise go unnoticed
  # (the site stays stale and the next cron sees "unchanged" and skips).
  notify-failure:
    needs: [build, deploy]
    if: always() && github.event_name != 'pull_request' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Slack alert (best-effort)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          for channel in "#dark-factory" "#logs"; do
            curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"channel\": \"$channel\", \"text\": \"🔴 site deploy FAILED (Pages) · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
              || true
          done

  # Success ping: confirms the site is actually live (distinct from the
  # factory's publish-web message, which only confirms the data was published).
  notify-success:
    needs: [build, deploy]
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Slack alert (best-effort)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\": \"#logs\", \"text\": \"🟢 catalog.ai.ua deployed successfully\"}" \
            || true
